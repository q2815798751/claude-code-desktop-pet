<!DOCTYPE html>
<html lang="zh-CN" data-theme="cyber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=320,height=440">
<title>CLAUDE.PET</title>
<style>
/* ============ themes ============ */
:root,
html[data-theme="cyber"]{            /* 赛博霓虹 (默认) */
  --bg1:#04060d; --bg2:#0a0f1c; --bg-body:#04060d;
  --txt:#cfe9ff; --dim:#5f7290;
  --ac:#00f0ff;  --ac-rgb:0,240,255;
  --ac2:#ff00e5; --ac2-rgb:255,0,229;
  --scan:255,255,255;
}
html[data-theme="paper"]{             /* 极简白 */
  --bg1:#fafaf7; --bg2:#efefe9; --bg-body:#f2f2ed;
  --txt:#1c1c1a; --dim:#8d8d86;
  --ac:#4a4a48;  --ac-rgb:74,74,72;
  --ac2:#b8894a; --ac2-rgb:184,137,74;
  --scan:0,0,0;
}
html[data-theme="matrix"]{            /* 终端绿 */
  --bg1:#001100; --bg2:#001b00; --bg-body:#000800;
  --txt:#b9ffc4; --dim:#3f8f4f;
  --ac:#00ff41;  --ac-rgb:0,255,65;
  --ac2:#00c42e; --ac2-rgb:0,196,46;
  --scan:0,255,65;
}
html[data-theme="gold"]{              /* 暗金 OLED */
  --bg1:#000000; --bg2:#0e0b06; --bg-body:#000000;
  --txt:#f3e9cd; --dim:#7d7056;
  --ac:#ffd166;  --ac-rgb:255,209,102;
  --ac2:#b58a2f; --ac2-rgb:181,138,47;
  --scan:255,209,102;
}

*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-body);
  font-family:'Cascadia Code','Cascadia Mono',Consolas,'Microsoft YaHei',monospace;
  color:var(--txt);transition:background .25s}
#shell{width:100%;min-width:320px;height:100%;min-height:430px;position:relative;display:flex;flex-direction:column;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(var(--ac-rgb),.10), transparent 55%),
    radial-gradient(90% 60% at 80% 100%, rgba(var(--ac2-rgb),.07), transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  border:1px solid rgba(var(--ac-rgb),.35);
  box-shadow:0 0 18px rgba(var(--ac-rgb),.18), inset 0 0 34px rgba(var(--ac-rgb),.06);
  padding:7px 10px 9px;transition:border-color .25s, box-shadow .25s}
/* scanlines */
#shell::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(var(--scan),.05) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay}
/* corner brackets */
.corner{position:absolute;width:11px;height:11px;border:1px solid var(--st);
  opacity:.8;pointer-events:none;filter:drop-shadow(0 0 4px var(--st))}
.corner.tl{top:3px;left:3px;border-right:none;border-bottom:none}
.corner.tr{top:3px;right:3px;border-left:none;border-bottom:none}
.corner.bl{bottom:3px;left:3px;border-right:none;border-top:none}
.corner.br{bottom:3px;right:3px;border-left:none;border-top:none}

/* header */
.header{display:flex;align-items:center;gap:6px;height:16px;flex:none}
.led{width:8px;height:8px;border-radius:50%;background:var(--st);flex:none;
  box-shadow:0 0 8px var(--st);animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.title{font-size:10px;letter-spacing:2px;color:var(--dim);white-space:nowrap;overflow:hidden}
.title b{color:var(--st);font-weight:600}
.clock{margin-left:auto;font-size:10px;color:var(--dim);letter-spacing:1px}

/* state line */
.statebox{flex:none;margin-top:4px}
.stateline{font-size:17px;font-weight:700;letter-spacing:3px;color:var(--st);
  text-shadow:0 0 8px var(--st),0 0 22px var(--st);display:flex;align-items:baseline;gap:8px}
.stateline .cn{font-size:9px;letter-spacing:1px;color:var(--dim);font-weight:400}
.bar{flex:none;height:5px;margin-top:5px;position:relative;background:rgba(var(--scan),.08);
  border:1px solid rgba(var(--scan),.12)}
.bar i{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,var(--st),transparent);
  box-shadow:0 0 8px var(--st);transition:width .4s linear}
.bar u{position:absolute;right:0;top:-1px;font-size:8px;color:var(--dim);
  letter-spacing:1px;padding-right:1px}

/* pet stage — always centered, scales a bit with window width */
:root{--pet-size:clamp(170px, min(54%, 224px), 224px)}
.stage{flex:1;min-height:110px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ring{position:absolute;width:calc(var(--pet-size) * 1.12);height:calc(var(--pet-size) * 1.12);border-radius:50%;
  border:1px solid rgba(var(--ac-rgb),.16);
  box-shadow:0 0 30px rgba(var(--ac-rgb),.10), inset 0 0 24px rgba(var(--ac-rgb),.05);
  animation:spin 14s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ring::before{content:'';position:absolute;top:-2px;left:50%;width:8px;height:4px;
  background:var(--st);box-shadow:0 0 8px var(--st);transform:translateX(-50%)}
#pet{position:relative;width:var(--pet-size);height:var(--pet-size);object-fit:contain;cursor:pointer;
  filter:drop-shadow(0 0 14px rgba(var(--ac-rgb),.22))}
#pet.dim{opacity:.75}

/* conversation panel */
.conv{flex:none;display:flex;flex-direction:column;margin-top:4px;
  border:1px solid rgba(var(--ac-rgb),.25);background:rgba(var(--ac-rgb),.04)}
.conv.hide{display:none}
.conv-head{font-size:8px;letter-spacing:1px;color:var(--dim);padding:2px 6px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center}
.conv-body{max-height:58px;overflow-y:auto;font-size:9px;line-height:1.35;padding:2px 6px;
  color:var(--txt);user-select:text;-webkit-user-select:text}
.conv-body .m{word-break:break-all;margin:1px 0}
.conv-body .u{color:var(--ac)}
.conv-body .a{color:var(--dim)}

/* input bar */
.inputbar{flex:none;display:flex;gap:4px;margin-top:4px}
#msg{flex:1;min-width:0;font-family:inherit;font-size:10px;color:var(--txt);
  background:rgba(var(--ac-rgb),.06);border:1px solid rgba(var(--ac-rgb),.3);
  padding:3px 6px;outline:none;user-select:text;-webkit-user-select:text}
#msg::placeholder{color:var(--dim)}
#bSend{flex:none;font-family:inherit;font-size:10px;letter-spacing:1px;color:var(--txt);
  background:rgba(var(--ac-rgb),.1);border:1px solid rgba(var(--ac-rgb),.35);padding:3px 8px;cursor:pointer}
#bSend:hover{background:rgba(var(--ac-rgb),.22)}

/* footer */
.footer{flex:none;margin-top:5px}
.meta{display:flex;justify-content:space-between;font-size:9px;color:var(--dim);
  letter-spacing:1px;margin-bottom:5px}
.meta b{color:var(--st);font-weight:400}
.btns{display:flex;gap:4px}
.btn{flex:1;font-family:inherit;font-size:9px;letter-spacing:1px;color:var(--txt);
  background:rgba(var(--ac-rgb),.05);border:1px solid rgba(var(--ac-rgb),.28);padding:4px 0;
  cursor:pointer;text-align:center;transition:all .15s}
.btn:hover{background:rgba(var(--ac-rgb),.18);color:var(--txt);box-shadow:0 0 10px rgba(var(--ac-rgb),.4)}
.btn.bad:hover{background:rgba(255,59,59,.2);border-color:#ff3b3b;box-shadow:0 0 10px rgba(255,59,59,.4)}
#toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);
  font-size:9px;letter-spacing:2px;color:var(--bg1);background:var(--st);
  padding:2px 8px;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none;
  box-shadow:0 0 12px var(--st);z-index:5}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="shell">
  <i class="corner tl"></i><i class="corner tr"></i>
  <i class="corner bl"></i><i class="corner br"></i>

  <div class="header">
    <span class="led" id="led"></span>
    <span class="title" id="titleTxt"><b>C:\&gt;</b> CLAUDE.PET // CYBER</span>
    <span class="clock" id="clock">--:--:--</span>
  </div>

  <div class="statebox">
    <div class="stateline"><span id="state">BOOT</span><span class="cn" id="statecn">初始化</span></div>
    <div class="bar"><i id="fill"></i><u id="age">AGE --</u></div>
  </div>

  <div class="stage">
    <div class="ring"></div>
    <img id="pet" alt="pet" draggable="false">
  </div>

  <div class="conv" id="conv">
    <div class="conv-head" id="convHead"><span>▾ 对话</span><span id="convCnt"></span></div>
    <div class="conv-body" id="convBody"></div>
  </div>

  <div class="inputbar">
    <input id="msg" type="text" placeholder="发送给 claude…" autocomplete="off">
    <button id="bSend" class="btn">发送</button>
  </div>

  <div class="footer">
    <div class="meta">
      <span>CLI <b id="cli">?</b></span>
      <span>TERM <b id="term">?</b></span>
      <span id="forcedTag"></span>
    </div>
    <div class="btns">
      <button class="btn" id="bTheme">主题</button>
      <button class="btn" id="bTerm">终端</button>
      <button class="btn" id="bDebug">调试</button>
      <button class="btn bad" id="bExit">退出</button>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
window.__INIT__ = __INIT_PAYLOAD__;

const GIFS = {
  thinking: 'thinking.gif',
  working: 'working.gif',
  working_long: 'workinglong.gif',
  done: 'done.gif',
  idle: 'offlineandidle.gif',
  offline: 'offlineandidle.gif',
  error: 'errorandwaityou.gif',
};
// per-theme state colors
const STATE_COLORS = {
  cyber:  { thinking:'#00f0ff', working:'#39ff14', working_long:'#ffb000', done:'#ff00e5', idle:'#8fa8c8', offline:'#ff3b3b', error:'#ff2a2a' },
  paper:  { thinking:'#2a6f97', working:'#2e7d32', working_long:'#b8860b', done:'#8e44ad', idle:'#7f8c8d', offline:'#c0392b', error:'#c0392b' },
  matrix: { thinking:'#00ff41', working:'#39ff9b', working_long:'#aaff00', done:'#00e5ff', idle:'#4fbf6f', offline:'#ff2a2a', error:'#ff2a2a' },
  gold:   { thinking:'#ffd166', working:'#ffb703', working_long:'#fb8500', done:'#e9c46a', idle:'#a58a5a', offline:'#ff6b6b', error:'#ff6b6b' },
};
const CN = {
  thinking: '思考中', working: '工作中', working_long: '长任务',
  done: '完成', idle: '待命', offline: '离线', error: '异常',
};
const THEMES = ['cyber', 'paper', 'matrix', 'gold'];
const THEME_NAMES = { cyber: 'CYBER', paper: 'PAPER', matrix: 'MATRIX', gold: 'GOLD' };

const petImg = document.getElementById('pet');
const led = document.getElementById('led');
const stateEl = document.getElementById('state');
const stateCn = document.getElementById('statecn');
const fill = document.getElementById('fill');
const ageEl = document.getElementById('age');
const clockEl = document.getElementById('clock');
const cliEl = document.getElementById('cli');
const termEl = document.getElementById('term');
const forcedTag = document.getElementById('forcedTag');
const titleTxt = document.getElementById('titleTxt');
const toast = document.getElementById('toast');
const conv = document.getElementById('conv');
const convHead = document.getElementById('convHead');
const convBody = document.getElementById('convBody');
const convCnt = document.getElementById('convCnt');
const msgInput = document.getElementById('msg');

let lastGifState = null;
let bust = 0;
let lastState = null;
let theme = 'cyber';
let lastConvKey = '';

function setVar(name, val){ document.documentElement.style.setProperty(name, val); }

function toastMsg(t){
  toast.textContent = t; toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 900);
}

function applyState(s){
  const pal = STATE_COLORS[theme] || STATE_COLORS.cyber;
  const color = pal[s] || pal.thinking;
  setVar('--st', color);
  led.style.background = color; led.style.boxShadow = '0 0 8px ' + color;
  stateEl.textContent = (s||'boot').toUpperCase();
  stateCn.textContent = CN[s] || '';
  petImg.classList.toggle('dim', s === 'offline');

  if (s !== lastGifState){
    lastGifState = s;
    bust++;
    petImg.src = 'gifs/' + (GIFS[s] || GIFS.idle) + '?v=' + bust;
  }
}

function applyTheme(t){
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('pet_theme', t); } catch(_) {}
  titleTxt.innerHTML = '<b>C:\\&gt;</b> CLAUDE.PET // ' + (THEME_NAMES[t] || 'CYBER');
  if (lastState) applyState(lastState.state);
}

function cycleTheme(){
  const i = THEMES.indexOf(theme);
  const n = THEMES[(i + 1) % THEMES.length];
  applyTheme(n);
  toastMsg('THEME ' + (THEME_NAMES[n] || n));
}

function tick(){
  const now = Date.now();
  const d = new Date();
  clockEl.textContent =
    String(d.getHours()).padStart(2,'0') + ':' +
    String(d.getMinutes()).padStart(2,'0') + ':' +
    String(d.getSeconds()).padStart(2,'0');

  if (lastState){
    const age = Math.max(0, now - lastState.lastActivity);
    const pct = Math.min(100, (age / 30000) * 100);
    fill.style.width = pct.toFixed(1) + '%';
    ageEl.textContent = 'AGE ' + (age/1000).toFixed(1) + 's';
  }
}

function render(json){
  lastState = json;
  applyState(json.state);
  cliEl.textContent = json.claude ? 'ON' : 'OFF';
  termEl.textContent = json.term ? (json.termAlive ? 'PID ' + json.term : 'GONE') : '--';
  forcedTag.textContent = json.forced ? '[DBG ' + json.state.toUpperCase() + ']' : '';
}

async function poll(){
  try{
    const r = await fetch('/api/state', {cache:'no-store'});
    const j = await r.json();
    if (j.shutdown){ window.close(); return; }
    render(j);
  }catch(e){
    try{ window.close(); }catch(_){}
  }
}

function api(path){
  return fetch(path, {method:'POST'}).catch(()=>{});
}

// ---- conversation ----
function renderConv(msgs){
  const key = JSON.stringify(msgs);
  if (key === lastConvKey) return;
  lastConvKey = key;
  convBody.innerHTML = '';
  for (const m of msgs){
    const d = document.createElement('div');
    d.className = 'm ' + (m.role === 'user' ? 'u' : 'a');
    d.textContent = (m.role === 'user' ? '你 › ' : 'AI › ') + m.text;
    convBody.appendChild(d);
  }
  convCnt.textContent = msgs.length ? msgs.length + ' 条' : '';
  convBody.scrollTop = convBody.scrollHeight;
}

async function pollConv(){
  try{
    const r = await fetch('/api/conv', {cache:'no-store'});
    const j = await r.json();
    renderConv(j.msgs || []);
  }catch(e){}
}

async function sendMsg(){
  const v = msgInput.value.trim();
  if (!v) return;
  try{
    const r = await fetch('/api/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text: v })
    });
    const j = await r.json();
    if (j.ok){ msgInput.value = ''; toastMsg('已发送 → claude'); }
    else toastMsg(j.reason || '发送失败');
  }catch(e){ toastMsg('发送失败'); }
}

// actions
document.getElementById('bTheme').onclick = ()=>{ cycleTheme(); };
document.getElementById('bTerm').onclick = ()=>{ api('/api/terminal?act=toggle'); toastMsg('TERM TOGGLE'); };
document.getElementById('bDebug').onclick = ()=>{
  api('/api/debug?cycle=1');
  toastMsg('DBG CYCLE');
};
document.getElementById('bExit').onclick = ()=>{ api('/api/exit'); };
document.getElementById('bSend').onclick = ()=>{ sendMsg(); };

convHead.onclick = ()=>{
  const hidden = conv.classList.toggle('hide');
  convHead.firstChild.textContent = hidden ? '▸ 对话' : '▾ 对话';
};

msgInput.addEventListener('keydown', (e)=>{
  if (e.key === 'Enter'){ e.preventDefault(); sendMsg(); }
});

petImg.addEventListener('dblclick', ()=>{ api('/api/focus'); toastMsg('FOCUS TERM'); });

document.addEventListener('keydown', (e)=>{
  if (e.target === msgInput) return; // typing in the input
  if (e.key === 't' || e.key === 'T'){ cycleTheme(); }
  if (e.key === 'd' || e.key === 'D'){ api('/api/debug?cycle=1'); toastMsg('DBG'); }
  if (e.key === 'Escape'){ api('/api/exit'); }
});

// boot
(function(){
  let saved = 'cyber';
  try { saved = localStorage.getItem('pet_theme') || 'cyber'; } catch(_) {}
  if (THEMES.indexOf(saved) === -1) saved = 'cyber';
  applyTheme(saved);

  const init = window.__INIT__ || {};
  render(init);
  tick();
})();

setInterval(tick, 1000);
setInterval(poll, 500);
setInterval(pollConv, 2000);
</script>
</body>
</html>
