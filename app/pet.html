<!DOCTYPE html>
<html lang="zh-CN" data-theme="cyber">
<head>
<meta charset="utf-8">
<title>CLAUDE.PET</title>
<style>
/* ============ themes ============ */
/* --warn / --crit are the alert accents. Every theme already had these colours in
   its state palette (awaiting / offline); the alert layer reuses them so a bubble
   never looks pasted on from another design. */
:root,
html[data-theme="cyber"]{
  --bg1:#04060d; --bg2:#0a0f1c; --bg-body:transparent;
  --txt:#b9dcff; --dim:#8fa6c4;
  --ac:#00f0ff;  --ac-rgb:0,240,255;
  --ac2:#ff00e5; --ac2-rgb:255,0,229;
  --warn:#ffcc00; --warn-rgb:255,204,0;
  --crit:#ff2a2a; --crit-rgb:255,42,42;
  --scan:255,255,255;
}
html[data-theme="paper"]{
  --bg1:#fafaf7; --bg2:#efefe9; --bg-body:transparent;
  --txt:#11110f; --dim:#5c5c58;
  --ac:#4a4a48;  --ac-rgb:74,74,72;
  --ac2:#b8894a; --ac2-rgb:184,137,74;
  /* #c77800 was only 3.0:1 on this theme's near-white panel — the alert title on
     the bubble and on the ball card both failed AA. Darkened to 5.1:1. */
  --warn:#965500; --warn-rgb:150,85,0;
  --crit:#c0392b; --crit-rgb:192,57,43;
  --scan:0,0,0;
}
html[data-theme="matrix"]{
  --bg1:#001100; --bg2:#001b00; --bg-body:transparent;
  --txt:#a0efac; --dim:#6fc47f;
  --ac:#00ff41;  --ac-rgb:0,255,65;
  --ac2:#00c42e; --ac2-rgb:0,196,46;
  --warn:#ffee00; --warn-rgb:255,238,0;
  --crit:#ff2a2a; --crit-rgb:255,42,42;
  --scan:0,255,65;
}
html[data-theme="gold"]{
  --bg1:#000000; --bg2:#0e0b06; --bg-body:transparent;
  --txt:#eadbb2; --dim:#b3a17c;
  --ac:#ffd166;  --ac-rgb:255,209,102;
  --ac2:#b58a2f; --ac2-rgb:181,138,47;
  --warn:#ff9f1c; --warn-rgb:255,159,28;
  --crit:#ff5a5a; --crit-rgb:255,90,90;
  --scan:255,209,102;
}
html[data-theme="sunset"]{            /* 落日橙 */
  --bg1:#1c0b2b; --bg2:#33102f; --bg-body:transparent;
  --txt:#ffe7d2; --dim:#c9a3b0;
  --ac:#ff6b35;  --ac-rgb:255,107,53;
  --ac2:#ff2e88; --ac2-rgb:255,46,136;
  --warn:#ffd166; --warn-rgb:255,209,102;
  --crit:#ff4d4d; --crit-rgb:255,77,77;
  --scan:255,107,53;
}
html[data-theme="ocean"]{             /* 深海蓝 */
  --bg1:#00121c; --bg2:#00293a; --bg-body:transparent;
  --txt:#c4f2ff; --dim:#8fbccb;
  --ac:#00e5ff;  --ac-rgb:0,229,255;
  --ac2:#00ffb3; --ac2-rgb:0,255,179;
  --warn:#ffd166; --warn-rgb:255,209,102;
  --crit:#ff5a5a; --crit-rgb:255,90,90;
  --scan:0,229,255;
}
:root{ --fs:1; --st:#00f0ff; }

*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;   /* transparent -> host see-through */
  font-family:'Cascadia Code','Cascadia Mono',Consolas,'Microsoft YaHei',monospace;color:var(--txt)}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99;
  font-size:calc(9px * var(--fs));letter-spacing:2px;color:var(--bg1);background:var(--st);
  padding:3px 10px;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none;
  box-shadow:0 0 12px var(--st)}
#toast.show{opacity:1}

/* ============ BALL VIEW ============ */
#ball{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:transparent;cursor:grab;touch-action:none}
#ball.dragging{cursor:grabbing}
.ball-ring{position:absolute;width:132px;height:132px;border-radius:50%;
  border:1px solid rgba(var(--ac-rgb),.45);
  box-shadow:0 0 20px rgba(var(--ac-rgb),.28), inset 0 0 16px rgba(var(--ac-rgb),.14);
  animation:spin 10s linear infinite}
.ball-ring::before{content:'';position:absolute;top:-2px;left:50%;width:10px;height:5px;
  background:var(--st);box-shadow:0 0 8px var(--st);transform:translateX(-50%)}
@keyframes spin{to{transform:rotate(360deg)}}
.ball-pet{position:relative;width:102px;height:102px;object-fit:contain;
  filter:drop-shadow(0 0 10px rgba(var(--ac-rgb),.35))}
.ball-status{position:absolute;top:8px;left:0;right:0;text-align:center;pointer-events:none;
  font-size:calc(11px * var(--fs));font-weight:600;letter-spacing:2px;color:var(--st);
  text-shadow:0 0 4px var(--st),0 0 3px var(--bg1)}
/* The ball window is only 150x170, so an alert cannot be a bubble here — it is a
   badge on the ring plus one line in the free strip under it. A critical alert
   opens the panel instead, which is where bubbles live. */
.ball-badge{position:absolute;top:22px;right:22px;min-width:16px;height:16px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;cursor:pointer;
  font-size:calc(9px * var(--fs));font-weight:700;color:#fff;background:var(--crit);
  box-shadow:0 0 10px var(--crit);animation:blink 1.6s steps(1) infinite}
.ball-badge[hidden]{display:none}
.ball-badge:hover{filter:brightness(1.35)}
/* A solid card, the same visual language as the panel bubbles, rather than bare
   glyphs over the GIF. The text sits on the ring and the animated pet, so red-on-
   red with a three-layer glow washed out completely at 10px; a themed plate plus
   a real font size is what makes it readable. Amber for a warn, red for a crit —
   it used to be --crit unconditionally, so a heavy-usage day shouted in alarm red.
   z-index keeps it above the ring, which it deliberately overlaps. */
.ball-alert{position:absolute;left:4px;right:4px;bottom:3px;z-index:3;padding:3px 6px 4px;
  text-align:center;pointer-events:none;
  font-size:calc(9px * var(--fs));line-height:1.2;font-weight:600;
  color:var(--warn);overflow-wrap:anywhere;overflow:hidden;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  border:1px solid rgba(var(--warn-rgb),.55);border-left:3px solid var(--warn);
  box-shadow:0 0 10px rgba(var(--warn-rgb),.28);
  max-height:calc(3 * 1.2 * 9px * var(--fs) + 9px)}
.ball-alert.crit{color:var(--crit);border-color:rgba(var(--crit-rgb),.6);
  border-left-color:var(--crit);box-shadow:0 0 10px rgba(var(--crit-rgb),.33)}
.ball-alert[hidden]{display:none}
.ball-alert b{display:block;letter-spacing:1px}
.ball-alert span{display:block;font-weight:400;color:var(--txt)}

/* bubble menu */
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:50}
#bubbles.show{pointer-events:auto}
.bubble{position:fixed;width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:rgba(var(--ac-rgb),.13);border:1px solid rgba(var(--ac-rgb),.5);
  color:var(--txt);font-size:calc(9px*var(--fs));font-weight:600;letter-spacing:1px;white-space:nowrap;
  transition:transform .16s ease;box-shadow:0 0 8px rgba(var(--ac-rgb),.25)}
.bubble:hover{background:rgba(var(--ac-rgb),.28)}
.bubble.bad{border-color:var(--crit);color:var(--crit)}

/* ============ PANEL VIEW ============ */
body.mode-ball #panel{display:none}
body.mode-panel #ball{display:none}
#panel{position:absolute;inset:0;display:flex;flex-direction:column;padding:7px 10px 9px;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(var(--ac-rgb),.10), transparent 55%),
    radial-gradient(90% 60% at 80% 100%, rgba(var(--ac2-rgb),.07), transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  border:1px solid rgba(var(--ac-rgb),.35);
  box-shadow:0 0 18px rgba(var(--ac-rgb),.18)}
#panel::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(var(--scan),.05) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay}
.corner{position:absolute;width:11px;height:11px;border:1px solid var(--st);opacity:.8;z-index:2;
  pointer-events:none;filter:drop-shadow(0 0 4px var(--st))}
.corner.tl{top:3px;left:3px;border-right:none;border-bottom:none}
.corner.tr{top:3px;right:3px;border-left:none;border-bottom:none}
.corner.bl{bottom:3px;left:3px;border-right:none;border-top:none}
.corner.br{bottom:3px;right:3px;border-left:none;border-top:none}

/* The header and the state box are the panel's drag handle, the way a title bar
   would be. Everything interactive inside them opts out (see makeDraggable). */
.header,.statebox{cursor:move}
.header button,.statebox button{cursor:pointer}
.header{display:flex;align-items:center;gap:5px;flex:none;min-height:16px}
.led{width:8px;height:8px;border-radius:50%;background:var(--st);flex:none;
  box-shadow:0 0 8px var(--st);animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.title{font-size:calc(10px * var(--fs));font-weight:600;letter-spacing:2px;color:var(--dim);
  flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title b{color:var(--st)}
.clock{flex:none;font-size:calc(10px * var(--fs));color:var(--dim)}
.mini{font-family:inherit;font-size:calc(11px*var(--fs));width:calc(15px*var(--fs));height:calc(15px*var(--fs));
  line-height:1;flex:none;color:var(--txt);background:rgba(var(--ac-rgb),.08);border:1px solid rgba(var(--ac-rgb),.3);
  cursor:pointer;padding:0}
.mini:hover{background:rgba(var(--ac-rgb),.22)}
.mini.on{color:var(--bg1);background:var(--st);border-color:var(--st);box-shadow:0 0 8px var(--st)}
.alertbadge{flex:none;cursor:pointer;font-size:calc(8px*var(--fs));font-weight:700;color:var(--crit);
  background:rgba(var(--crit-rgb),.14);border:1px solid var(--crit);padding:0 3px;line-height:1.5;
  box-shadow:0 0 7px rgba(var(--crit-rgb),.5);animation:blink 1.6s steps(1) infinite}
.alertbadge[hidden]{display:none}
.alertbadge:hover{background:rgba(var(--crit-rgb),.3)}

.statebox{flex:none;margin-top:4px}
/* One weak glow, not two. The old 0 0 8px + 0 0 20px pair bled the glyph edges into
   each other and made the state word read as a smear rather than text. */
.stateline{font-size:calc(16px * var(--fs));font-weight:700;letter-spacing:2px;color:var(--st);
  text-shadow:0 0 4px var(--st);display:flex;align-items:baseline;gap:8px;flex:none}
.stateline .cn{font-size:calc(9px * var(--fs));letter-spacing:1px;color:var(--dim);font-weight:400;
  text-shadow:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{flex:none;height:5px;margin-top:5px;position:relative;background:rgba(var(--scan),.08);border:1px solid rgba(var(--scan),.12)}
.bar i{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,var(--st),transparent);box-shadow:0 0 8px var(--st);transition:width .4s linear}
.bar u{position:absolute;right:0;top:-1px;font-size:calc(8px * var(--fs));color:var(--dim)}

/* ---- usage strip: always on, one line ---- */
.ubar{flex:none;display:flex;align-items:center;gap:8px;margin-top:5px;padding:2px 5px;
  font-size:calc(9px * var(--fs));font-weight:600;color:var(--dim);cursor:pointer;
  border:1px solid rgba(var(--ac-rgb),.18);background:rgba(var(--ac-rgb),.04);white-space:nowrap}
.ubar:hover{background:rgba(var(--ac-rgb),.13)}
.ubar b{color:var(--st);font-weight:600}
.ubar .uctx{margin-left:auto;display:flex;align-items:center;gap:4px}
.ubar .ufill{position:relative;display:block;width:calc(44px * var(--fs));height:6px;
  background:rgba(var(--scan),.12);border:1px solid rgba(var(--scan),.16)}
.ubar .ufill i{position:absolute;inset:0;width:0;background:var(--st);box-shadow:0 0 6px var(--st);transition:width .3s}
.ubar.warn b{color:var(--warn)}
.ubar.warn .ufill i{background:var(--warn);box-shadow:0 0 6px var(--warn)}
.ubar.over b{color:var(--crit)}
.ubar.over .ufill i{background:var(--crit);box-shadow:0 0 6px var(--crit)}
.ubar.over{border-color:rgba(var(--crit-rgb),.4)}

.stage{flex:1;min-height:118px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
/* Sized by HEIGHT only, then squared with aspect-ratio.
   `--pet-size` used to be one clamp() applied to both width and height, and a
   percentage resolves against each axis separately: at rest that happened to give
   185x186, but once alert bubbles squeezed the stage to 137px the height resolved
   to 62% of 137 = 85px (floored to 120) while the width stayed 185 — so the pet
   box went non-square and .panel-ring drew as a 200x130 ellipse. Driving both from
   the height keeps them identical by construction. */
:root{--pet-h:clamp(110px, 62%, 210px)}
.panel-ring{position:absolute;height:calc(var(--pet-h)*1.08);aspect-ratio:1/1;width:auto;border-radius:50%;
  border:1px solid rgba(var(--ac-rgb),.16);box-shadow:0 0 30px rgba(var(--ac-rgb),.10);
  animation:spin 14s linear infinite}
/* Transitioned: the stage gives up room when alert bubbles appear, so the pet
   resizes with them instead of snapping. */
#pet{position:relative;height:var(--pet-h);aspect-ratio:1/1;width:auto;object-fit:contain;cursor:pointer;
  transition:height .18s ease;
  filter:drop-shadow(0 0 14px rgba(var(--ac-rgb),.22))}
#pet.dim{opacity:.6}
body.usage-mode #pet,body.usage-mode .panel-ring{display:none}

/* ---- usage page: replaces the pet in the stage ---- */
/* This is an absolutely-positioned box that fills the stage, and it used to
   overflow it. `justify-content:center` with content taller than the container
   spills BOTH ways, so when alert bubbles squeezed the stage to 137px the page's
   172px of content pushed its bottom row (the alert toggle and font buttons) down
   to y=264 — 30px on top of the first alert bubble, i.e. the token panel covering
   the token warnings. Now every row is fixed except the sparkline, which is the
   only element allowed to flex, so the page always sums to exactly the stage
   height. overflow:hidden is belt-and-braces for a font size we have not seen. */
#usageView{position:absolute;inset:0;display:flex;flex-direction:column;gap:5px;padding:1px 0;overflow:hidden}
#usageView[hidden]{display:none}
.uv-tabs{display:flex;gap:3px;flex:none}
.uv-tab{flex:1;font-family:inherit;font-size:calc(9px*var(--fs));font-weight:600;letter-spacing:1px;
  color:var(--dim);background:rgba(var(--ac-rgb),.04);border:1px solid rgba(var(--ac-rgb),.2);
  padding:2px 0;line-height:1.2;cursor:pointer}
.uv-tab:hover{background:rgba(var(--ac-rgb),.14)}
.uv-tab.on{color:var(--bg1);background:var(--st);border-color:var(--st)}
/* Four stats on one row rather than a 2x2 grid: the grid cost 74px, which does not
   fit once alerts are on screen. Full labels live in the tooltips. */
.uv-stats{display:flex;gap:3px;flex:none}
.uv-cell{flex:1;min-width:0;display:flex;flex-direction:column;gap:0;padding:2px 4px;
  border:1px solid rgba(var(--ac-rgb),.16);background:rgba(var(--ac-rgb),.04)}
.uv-k{font-size:calc(8px*var(--fs));line-height:1.1;letter-spacing:1px;color:var(--dim)}
.uv-v{font-size:calc(12px*var(--fs));line-height:1.15;font-weight:700;color:var(--st);
  text-shadow:0 0 4px var(--st);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uv-ctx{display:flex;align-items:center;gap:6px;flex:none;font-size:calc(8px*var(--fs));color:var(--dim)}
.uv-ctx[hidden]{display:none}
.uv-bar{flex:1;position:relative;height:7px;background:rgba(var(--scan),.1);border:1px solid rgba(var(--scan),.14)}
.uv-bar i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--st),transparent);
  transition:width .3s}
.uv-bar i.warn{background:linear-gradient(90deg,var(--warn),transparent)}
.uv-bar i.over{background:linear-gradient(90deg,var(--crit),transparent)}
/* The one row that absorbs slack — and the first to give it up. Capped, or with
   no alerts on screen it would soak up the whole 300px stage and dominate a
   page that is supposed to be about the numbers. */
.uv-spark{display:flex;align-items:flex-end;gap:3px;flex:1 1 auto;min-height:8px;
  max-height:calc(28px*var(--fs))}
.uv-spark[hidden]{display:none}
.uv-spark i{flex:1;min-height:2px;background:linear-gradient(180deg,var(--st),transparent);
  box-shadow:0 0 6px rgba(var(--ac-rgb),.35)}
.uv-spark i.today{background:linear-gradient(180deg,var(--warn),transparent)}
/* A day with no usage still needs a visible column, or the chart reads as gaps. */
.uv-spark i.zero{background:rgba(var(--scan),.18);box-shadow:none}
.uv-foot{display:flex;align-items:center;gap:6px;flex:none;font-size:calc(8px*var(--fs));color:var(--dim)}
.uv-foot .sp{margin-left:auto}
.uv-toggle{font-family:inherit;font-size:calc(9px*var(--fs));font-weight:600;color:var(--txt);
  background:rgba(var(--ac-rgb),.05);border:1px solid rgba(var(--ac-rgb),.28);padding:1px 9px;cursor:pointer}
.uv-toggle:hover{background:rgba(var(--ac-rgb),.18)}
.uv-toggle.on{color:var(--bg1);background:var(--st);border-color:var(--st)}

.nowbar{flex:none;display:flex;gap:6px;margin-top:4px;font-size:calc(9px*var(--fs));font-weight:600;color:var(--dim);
  border:1px solid rgba(var(--ac-rgb),.18);background:rgba(var(--ac-rgb),.04);padding:2px 6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowbar b{color:var(--st);font-weight:400}

.footer{flex:none;margin-top:5px}
.meta{display:flex;justify-content:space-between;font-size:calc(9px * var(--fs));font-weight:600;color:var(--dim);margin-bottom:5px}
.meta b{color:var(--st);font-weight:400}
.btns{display:flex;gap:4px}
.btn{flex:1;font-family:inherit;font-size:calc(9px * var(--fs));font-weight:600;letter-spacing:1px;color:var(--txt);
  background:rgba(var(--ac-rgb),.05);border:1px solid rgba(var(--ac-rgb),.28);padding:calc(4px * var(--fs)) 0;
  cursor:pointer;text-align:center;transition:all .15s}
.btn:hover{background:rgba(var(--ac-rgb),.18)}

/* ============ ALERT BUBBLES ============ */
/* Chat-app cards, stacked upward from just above the footer. Colours come from the
   active theme: --warn for a heads-up, --crit for something that needs you now. */
/* A flex sibling of the stage, not a floating layer. It used to be position:fixed
   above the nowbar, which meant a full stack of bubbles sat on top of the pet.
   In the panel's column the stage simply yields the space, and the pet re-centres
   and shrinks through its own clamp() — overlap is impossible by construction.
   Empty, it collapses to nothing, so the layout is unchanged when there are no
   alerts. */
#alertStack{flex:none;display:flex;flex-direction:column;gap:5px;margin-top:5px;pointer-events:none}
#alertStack:empty{margin-top:0}
/* fill-mode is `none`, not `both`. With `both` the card's resting state comes from
   the keyframes, so if the animation never runs — throttled renderer, occluded or
   backgrounded window — the card holds the `from` frame at opacity 0 forever: it
   occupies 48px of layout and is completely invisible. Verified: three cards sat at
   computed opacity 0. With `none` the base style (opaque) is what shows if the
   animation does not run, and the animation still plays when it does. */
.alert{position:relative;pointer-events:auto;cursor:pointer;overflow:hidden;
  padding:5px 8px 7px;border:1px solid rgba(var(--warn-rgb),.5);border-left:3px solid var(--warn);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  box-shadow:0 0 14px rgba(var(--warn-rgb),.22);
  animation:bubbleIn .18s ease-out none}
.alert.crit{border-color:rgba(var(--crit-rgb),.55);border-left-color:var(--crit);
  box-shadow:0 0 16px rgba(var(--crit-rgb),.32);
  animation:bubbleIn .18s ease-out none, bubbleShake .45s ease-out .18s none}
/* The exit keeps `forwards` so the fade holds until the node is removed. */
.alert.out{animation:bubbleOut .18s ease-in forwards}
@keyframes bubbleIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bubbleOut{to{opacity:0;transform:translateY(-6px) scale(.97)}}
@keyframes bubbleShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}
  45%{transform:translateX(3px)}70%{transform:translateX(-2px)}}
.al-top{display:flex;align-items:center;gap:5px}
.al-ico{font-size:calc(9px*var(--fs));color:var(--warn);text-shadow:0 0 7px var(--warn)}
.alert.crit .al-ico{color:var(--crit);text-shadow:0 0 7px var(--crit)}
.al-title{flex:1;min-width:0;font-size:calc(10px*var(--fs));font-weight:700;letter-spacing:1px;
  color:var(--warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert.crit .al-title{color:var(--crit)}
.al-x{flex:none;font-family:inherit;font-size:calc(11px*var(--fs));line-height:1;color:var(--dim);
  background:none;border:none;cursor:pointer;padding:0 1px}
.al-x:hover{color:var(--txt)}
/* Solid, not 82% opaque: the detail line carries the actual numbers, and it was the
   dimmest text in the card. */
.al-detail{margin-top:2px;font-size:calc(9px*var(--fs));color:var(--txt);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al-drain{position:absolute;left:0;bottom:0;height:2px;background:var(--warn);
  box-shadow:0 0 6px var(--warn);animation:drain 8s linear forwards}
.alert.crit .al-drain{background:var(--crit);box-shadow:0 0 6px var(--crit)}
@keyframes drain{from{width:100%}to{width:0}}
</style>
</head>
<body class="mode-ball">
<script>
window.__INIT__ = __INIT_PAYLOAD__;
window.__CONFIG__ = __CONFIG_PAYLOAD__;
</script>

<!-- ============ BALL ============ -->
<div id="ball">
  <div class="ball-ring"></div>
  <img id="ballPet" class="ball-pet" alt="pet" draggable="false">

<script>
const GIFS = { thinking:'thinking.gif', working:'working.gif', working_long:'workinglong.gif', done:'done.gif', idle:'offlineandidle.gif', awaiting:'offlineandidle.gif', offline:'offlineandidle.gif', error:'errorandwaityou.gif' };
const STATE_COLORS = {
  cyber:  { thinking:'#00f0ff', working:'#39ff14', awaiting:'#ffcc00', done:'#ff00e5', idle:'#8fa8c8', offline:'#ff3b3b', error:'#ff2a2a' },
  paper:  { thinking:'#2a6f97', working:'#2e7d32', awaiting:'#c77800', done:'#8e44ad', idle:'#7f8c8d', offline:'#c0392b', error:'#c0392b' },
  matrix: { thinking:'#00ff41', working:'#39ff9b', awaiting:'#ffee00', done:'#00e5ff', idle:'#4fbf6f', offline:'#ff2a2a', error:'#ff2a2a' },
  gold:   { thinking:'#ffd166', working:'#ffb703', awaiting:'#ff9f1c', done:'#e9c46a', idle:'#a58a5a', offline:'#ff6b6b', error:'#ff6b6b' },
  sunset: { thinking:'#ff6b35', working:'#ffb347', awaiting:'#ffd166', done:'#ff2e88', idle:'#c08a9a', offline:'#ff5a5a', error:'#ff4d4d' },
  ocean:  { thinking:'#00e5ff', working:'#00ffb3', awaiting:'#ffd166', done:'#7c4dff', idle:'#5a9aa8', offline:'#ff5a5a', error:'#ff4d4d' },
};
const CN = { thinking:'思考中', working:'工作中', awaiting:'等待输入', done:'完成', idle:'待命', offline:'离线', error:'异常' };
// tool name -> 中文（与 server.js 的 TOOL_LABELS 保持一致，仅用于状态行）
const TOOL_CN = {
  Bash:'运行命令', Edit:'编辑文件', Read:'读取文件', Write:'写文件', Glob:'查找文件', Grep:'搜索代码',
  NotebookEdit:'编辑笔记', WebSearch:'联网搜索', WebFetch:'抓取网页', Agent:'调用子代理',
  TaskCreate:'创建任务', TodoWrite:'更新任务', Skill:'调用技能',
};
const THEMES = ['cyber','paper','matrix','gold','sunset','ocean'];
const THEME_NAMES = { cyber:'CYBER', paper:'PAPER', matrix:'MATRIX', gold:'GOLD', sunset:'SUNSET', ocean:'OCEAN' };
const FS_MIN = 0.85, FS_MAX = 1.35;
const BALL_W = 150, BALL_H = 170, PANEL_W = 320, PANEL_H = 480;
const ALERT_TTL = 8000, ALERT_MAX = 3;   // how long a bubble lives, how many stack

const ball = document.getElementById('ball');
const ballPet = document.getElementById('ballPet');

const stateCn = document.getElementById('statecn');

const ageEl = document.getElementById('age');
const clockEl = document.getElementById('clock');
const cliEl = document.getElementById('cli');
const termEl = document.getElementById('term');
const forcedTag = document.getElementById('forcedTag');
const titleTxt = document.getElementById('titleTxt');
const toast = document.getElementById('toast');
const nowEl = document.getElementById('now');
const alertBadge = document.getElementById('alertBadge');
const alertStack = document.getElementById('alertStack');
const usageBar = document.getElementById('usageBar');
const uIn = document.getElementById('uIn');
const uOut = document.getElementById('uOut');
const uCtxPct = document.getElementById('uCtxPct');
const uFill = document.getElementById('uFill');
const usageViewEl = document.getElementById('usageView');
const uvIn = document.getElementById('uvIn');
const uvOut = document.getElementById('uvOut');
const uvHit = document.getElementById('uvHit');
const uvMsgs = document.getElementById('uvMsgs');

const uvCtx = document.getElementById('uvCtx');

const uvSpark = document.getElementById('uvSpark');

let theme = 'cyber', fs = 1, mode = 'ball', prevState = null, curOpacity = 100;
let lastGif = null, bust = 0, lastState = null, topmost = true;
let usageOpen = false, uvTab = 'session';

function setVar(n, v){ document.documentElement.style.setProperty(n, v); }
function toastMsg(t){ toast.textContent = t; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'), 900); }

// ---- WebView2 host bridge ----
function callHost(method){
  try {
    const h = window.chrome && window.chrome.webview && window.chrome.webview.hostObjects && window.chrome.webview.hostObjects.petHost;
    if (h && h[method]){
      const args = Array.prototype.slice.call(arguments, 1);
      const r = h[method].apply(h, args);
      if (r && r.then) r.catch(()=>{});
    }
  } catch(_){}
}

// ---- mode ----
function setMode(m){
  mode = m;
  document.body.className = 'mode-' + m;
  if (m === 'panel') callHost('Resize', PANEL_W, PANEL_H);
  else callHost('Resize', BALL_W, BALL_H);
}

// ---- drag (ball and panel share it) ----
// The ball used to be the only draggable thing, which left the panel stranded
// wherever the ball happened to be. The panel's header + state box now behave like
// a title bar. A movement under 2px stays a click, so the buttons still work.
function makeDraggable(el, opts){
  const skip = (opts && opts.skip) || function(){ return false; };
  let drag = null, moved = false;
  el.addEventListener('pointerdown', (e) => {
    if (e.button === 2) return;              // right-click is the bubble menu
    if (skip(e.target)) return;              // buttons inside the drag zone
    el.setPointerCapture(e.pointerId);
    drag = { x: e.screenX, y: e.screenY };
    moved = false;
    el.classList.add('dragging');
  });
  el.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.screenX - drag.x, dy = e.screenY - drag.y;
    drag.x = e.screenX; drag.y = e.screenY;
    // screenX/Y, not clientX/Y: the window moves under the cursor, so page
    // coordinates would feed the delta back into itself.
    if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    if (moved) callHost('Move', dx, dy);
  });
  function end(){ drag = null; el.classList.remove('dragging'); }
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  return { moved: () => moved, dragging: () => !!drag };
}

// ---- state ----
function applyState(j){
  const s = j.state || 'offline';
  const pal = STATE_COLORS[theme] || STATE_COLORS.cyber;
  const color = pal[s] || pal.thinking;
  setVar('--st', color);
  led.style.background = color; led.style.boxShadow = '0 0 8px ' + color;

  // The big line is the STATE and it is always Chinese; the tool that is running
  // goes on the sub-line, also Chinese. It used to be the other way round and in
  // English ("WORKING", or the raw tool name uppercased as "BASH"), which said
  // nothing in a language the panel is otherwise written in. The specific command
  // hint the user still needs stays verbatim in the 现在 row ("运行 Bash").
  const tool = (s === 'working' && j.tool) ? j.tool : '';
  stateEl.textContent = CN[s] || s;
  stateCn.textContent = tool ? (TOOL_CN[tool] || tool) : '';
  stateCn.title = tool ? ('正在执行：' + tool) : '';
  ballStatus.textContent = tool ? (TOOL_CN[tool] || tool) : (CN[s] || '');
  petImg.classList.toggle('dim', s === 'offline');

  const gifKey = (s === 'working' && j.long) ? 'working_long' : s;
  if (gifKey !== lastGif){
    lastGif = gifKey; bust++;
    const g = 'gifs/' + (GIFS[gifKey] || GIFS.idle) + '?v=' + bust;
    ballPet.src = g; petImg.src = g;
  }
  // Notifications fire on the EDGE only. This used to re-trigger on every poll,
  // so an 'error' state beeped twice a second for as long as it lasted.
  if (s !== prevState){
    if (s === 'error') notify('工具出错，请查看');
    else if (s === 'awaiting') notify('Claude 在等你');
    else if (s === 'done' && (prevState === 'working' || prevState === 'working_long')) notify('任务完成');
  }
  prevState = s;
}
function notify(msg){ toastMsg(msg); beep(880, 0.18); }
// One AudioContext for the whole page. Creating one per beep leaked, and the
// browser starts throwing after a handful of them (the pet went silent).
let audioCtx = null;
function beep(freq, dur){
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = freq || 880; g.gain.value = 0.08;
    o.start(); o.stop(audioCtx.currentTime + (dur || 0.18));
  } catch(_){}
}
// A critical alert gets two rising tones so it is distinguishable without looking.
function alertBeep(level){
  if (level === 'crit'){ beep(520, 0.12); setTimeout(() => beep(780, 0.16), 130); }
  else beep(660, 0.14);
}

// ---- theme / font / config ----
// The server owns the preferences (app/config.json) and hands them back through
// __CONFIG__ on every load, so the page keeps no copy of its own. It used to
// write localStorage as well — two sources that disagreed after a manual edit.
function persistConfig(extra){
  try {
    const body = Object.assign({ theme, fs }, extra || {});
    fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
      .then((r) => r.json())
      .then((j) => { if (j && j.config) window.__CONFIG__ = j.config; })
      .catch(()=>{});
  } catch(_){}
}
function alertCfg(){
  const c = (window.__CONFIG__ && window.__CONFIG__.usage) || {};
  return c;
}
function alertsOn(){ return alertCfg().enabled !== false; }
function applyTheme(t){
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  titleTxt.title = 'CLAUDE.PET // ' + (THEME_NAMES[t] || 'CYBER');
  if (lastState) applyState(lastState);
  persistConfig();
}
function cycleTheme(){ applyTheme(THEMES[(THEMES.indexOf(theme)+1) % THEMES.length]); toastMsg('THEME ' + THEME_NAMES[theme]); }
function applyFs(v){ fs = Math.min(FS_MAX, Math.max(FS_MIN, v)); setVar('--fs', String(fs)); }

function tick(){
  const d = new Date();
  clockEl.textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  if (lastState){
    const age = Math.max(0, Date.now() - lastState.lastActivity);
    fill.style.width = Math.min(100, (age/30000)*100).toFixed(1) + '%';
    ageEl.textContent = '静默 ' + (age/1000).toFixed(1) + 's';
  }
}

// ---- usage ----
// Same compact format as fmtTok() in app/usage.js — the page is a static file with
// no imports, so the two copies have to stay in step (like TOOL_LABELS/TOOL_CN).
function fmtTok(n){
  const v = Number(n) || 0;
  const trim = (s) => s.replace(/\.0$/, '');
  if (v < 1000) return String(Math.round(v));
  if (v < 1e6) return trim((v/1000).toFixed(1)) + 'k';
  return trim((v/1e6).toFixed(1)) + 'M';
}
function ctxLevel(pct){
  const c = alertCfg();
  if (pct >= (c.ctxCritPct || 92)) return 'over';
  if (pct >= (c.ctxWarnPct || 80)) return 'warn';
  return '';
}
function renderUsage(u){
  if (!u) return;
  const ready = !!u.ready;
  const s = u.session || {};
  const pct = (u.ctx && u.ctx.pct) || 0;
  uIn.textContent = ready ? fmtTok(s.input) : '…';
  uOut.textContent = ready ? fmtTok(s.out) : '…';
  uCtxPct.textContent = ready ? pct + '%' : '--%';
  uFill.style.width = (ready ? pct : 0) + '%';
  const lv = ready ? ctxLevel(pct) : '';
  usageBar.classList.toggle('warn', lv === 'warn');
  usageBar.classList.toggle('over', lv === 'over');
  usageBar.title = '本次会话 token · 上下文 ' + pct + '% — 点击查看详情';
}
function renderUsageView(u){
  if (!u) return;
  const b = (uvTab === 'session' ? u.session : uvTab === 'today' ? u.today : u.total) || {};
  uvIn.textContent = fmtTok(b.input);
  uvOut.textContent = fmtTok(b.out);
  uvHit.textContent = (b.hit === null || b.hit === undefined) ? '—' : b.hit + '%';
  uvMsgs.textContent = String(b.msgs || 0);

  const ctx = u.ctx || { tokens:0, window:0, pct:0 };
  // The context figure is a property of the running session, not of a day bucket.
  uvCtxRow.hidden = uvTab !== 'session';
  uvCtx.textContent = fmtTok(ctx.tokens) + ' / ' + fmtTok(ctx.window);
  uvFill.style.width = ctx.pct + '%';
  uvFill.className = ctxLevel(ctx.pct);

  const spark = u.spark || [];
  const max = Math.max(1, spark.map((d) => d.tokens).reduce((a, c) => Math.max(a, c), 0));
  uvSpark.innerHTML = '';
  spark.forEach((d, i) => {
    const el = document.createElement('i');
    el.style.height = Math.max(3, Math.round((d.tokens / max) * 100)) + '%';
    if (!d.tokens) el.classList.add('zero');
    if (i === spark.length - 1) el.classList.add('today');
    el.title = d.day + ' · ' + fmtTok(d.tokens) + ' tokens';
    uvSpark.appendChild(el);
  });
}
function setUsagePage(on){
  usageOpen = on;
  usageViewEl.hidden = !on;
  bUsage.classList.toggle('on', on);
  document.body.classList.toggle('usage-mode', on);
  if (on && lastState) renderUsageView(lastState.usage);
}
function syncAlertsToggle(){
  const on = alertsOn();
  uvAlerts.classList.toggle('on', on);
  uvAlerts.textContent = on ? '开' : '关';
}

// ---- alerts ----
// The server owns the rule engine (edge-triggered + cooldown, see app/alerts.js) and
// ships the current list in every frame. The page only decides presentation: a badge
// while collapsed, bubbles while open. A bubble pops once per firing — keyed on
// firedAt, so a reconnect or a reload never replays an old alert.
//
// "Unread" is the page's own notion on top of the server's "active". A condition can
// stay true for an hour (context above a line, a heavy day), and a badge that stays
// lit that whole time stops meaning anything. Clicking the badge — or dismissing a
// bubble by hand — marks that firing as seen, and the dot goes quiet until the rule
// fires again with a new firedAt.
const seenAlerts = new Map();     // id -> firedAt already popped as a bubble
const ackAlerts = new Map();      // id -> firedAt the user has acknowledged
let firstFrame = true;

const activeAlerts = () => ((lastState && lastState.alerts) || []).filter((a) => a.active);
const isAcked = (a) => ackAlerts.get(a.id) === a.firedAt;
const unreadAlerts = () => activeAlerts().filter((a) => !isAcked(a));

function renderAlertIndicators(){
  const unread = unreadAlerts();
  const n = unread.length;
  alertBadge.hidden = n === 0;
  alertBadge.textContent = n;
  alertBadge.title = n ? n + ' 条未读告警，点击查看' : '';
  ballBadge.hidden = n === 0;
  ballBadge.textContent = n;
  ballBadge.title = alertBadge.title;

  // The ball strip follows the unread set too: acknowledging is the user saying
  // "seen it", so it goes quiet even though the condition is still standing.
  ballAlert.textContent = '';
  ballAlert.hidden = n === 0;
  if (!n) return;
  const a = unread[0];
  ballAlert.classList.toggle('crit', a.level === 'crit');
  ballAlert.title = a.title + ' — ' + a.detail;
  const b = document.createElement('b');
  b.textContent = a.title;
  const s = document.createElement('span');
  s.textContent = a.detail;
  ballAlert.appendChild(b);
  ballAlert.appendChild(s);
}

function ackAlert(a){
  if (!a || !a.firedAt) return;
  ackAlerts.set(a.id, a.firedAt);
  renderAlertIndicators();
}
function ackAllActive(){
  activeAlerts().forEach((a) => { if (a.firedAt) ackAlerts.set(a.id, a.firedAt); });
  renderAlertIndicators();
}
// Mark everything read, then show it. The order matters: acking first means the
// bubbles are the record of what was just cleared.
function openAlerts(){
  const active = activeAlerts();
  ackAllActive();
  if (!active.length) return;
  if (mode === 'ball') setMode('panel');
  active.slice().reverse().forEach((a, i) => setTimeout(() => pushAlertBubble(a), i * 90));
}

function renderAlerts(list){
  const all = list || [];
  // Deliberately NOT clearing the stack when the list is empty. It used to, which
  // defeated the whole point of the 8s dismiss: a rule fires, the bubble appears,
  // the condition lapses a second later and the very next frame wiped it. Bubbles
  // now live out their own life and leave via the timer, the × or a click.
  for (const a of all){
    if (!a.firedAt) continue;
    if (seenAlerts.get(a.id) === a.firedAt) continue;
    seenAlerts.set(a.id, a.firedAt);
    if (firstFrame) continue;                       // never replay history on load
    // Collapsed and something critical: open up rather than expect the user to
    // notice a red dot. Once per firing, and never mid-drag.
    if (mode === 'ball' && a.level === 'crit' && !ballDrag.dragging()) setMode('panel');
    pushAlertBubble(a);
  }
  renderAlertIndicators();
}
function pushAlertBubble(a){
  const el = document.createElement('div');
  el.className = 'alert' + (a.level === 'crit' ? ' crit' : '');
  el.innerHTML = '<div class="al-top"><span class="al-ico"></span>' +
    '<span class="al-title"></span><button class="al-x" title="关闭">×</button></div>' +
    '<div class="al-detail"></div><i class="al-drain"></i>';
  // textContent, not innerHTML: the detail string is built server-side from
  // transcript data, and this page does not inject that as markup.
  el.querySelector('.al-ico').textContent = a.level === 'crit' ? '▲' : '△';
  el.querySelector('.al-title').textContent = a.title;
  el.querySelector('.al-detail').textContent = a.detail;

  let closed = false;
  // `seen` is the difference between "the user dismissed this" and "the eight
  // seconds ran out". Only the former clears the dot; a bubble timing out over an
  // empty desk means nobody read it.
  const close = (seen) => {
    if (closed) return;
    closed = true;
    if (seen) ackAlert(a);
    el.classList.add('out');
    setTimeout(() => el.remove(), 200);
  };
  el.querySelector('.al-x').addEventListener('click', (e) => { e.stopPropagation(); close(true); });
  el.addEventListener('click', () => close(true));
  setTimeout(() => close(false), ALERT_TTL);

  alertStack.appendChild(el);
  while (alertStack.children.length > ALERT_MAX) alertStack.removeChild(alertStack.firstChild);
  alertBeep(a.level);
}

function render(json){
  lastState = json;
  applyState(json);
  // CLI ON* means the Claude Code hooks are feeding us (exact phase); without the
  // star the pet is inferring the phase from the transcript alone.
  cliEl.textContent = (json.claude ? 'ON' : 'OFF') + (json.hooked ? '*' : '');
  cliEl.title = json.hooked ? 'hooks 已接入' : 'hooks 未接入（回退到转录推断）';
  termEl.textContent = json.term ? (json.termAlive ? 'PID ' + json.term : 'GONE') : '--';
  forcedTag.textContent = json.forced ? '[DBG]' : '';
  if (json.lastAction) nowEl.textContent = json.lastAction;
  renderUsage(json.usage);
  renderAlerts(json.alerts);
  if (usageOpen) renderUsageView(json.usage);
  firstFrame = false;
}

function dismiss(){ persistConfig(); callHost('Close'); try { window.close(); } catch(_){} }
function handleState(j){
  if (j.shutdown){ dismiss(); return; }
  render(j);
}
// A dropped connection must not kill the pet: the old code closed the window on
// the very first failed poll, so restarting the server took the pet with it.
let fails = 0;
function noteFail(){ if (++fails >= 6) dismiss(); }

// Live state over SSE — the server pushes a frame when something actually changes.
// (Polling /api/state twice a second was the old way; it is kept only as fallback.)
let es = null, pollTimer = null;
function startPolling(){
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    try {
      const r = await fetch('/api/state', {cache:'no-store'});
      fails = 0;
      handleState(await r.json());
    } catch(_){ noteFail(); }
  }, 1000);
}
function connect(){
  if (!window.EventSource) return startPolling();
  try { es = new EventSource('/events'); } catch(_){ return startPolling(); }
  es.addEventListener('state', (e) => {
    fails = 0;
    try { handleState(JSON.parse(e.data)); } catch(_){}
  });
  es.onerror = () => { noteFail(); }; // EventSource retries on its own
  // if the stream is unusable, a slow poll still keeps the pet honest
  setTimeout(() => { if (fails && !pollTimer) startPolling(); }, 20000);
}
function api(path){ return fetch(path, {method:'POST'}).catch(()=>{}); }

// ---- bubbles ----
const BUBBLES = [
  {act:'theme', label:'主题'},
  {act:'term', label:'终端'},
  {act:'top', label:'置顶'},
  {act:'op+', label:'+透'},
  {act:'op-', label:'-透'},
  {act:'exit', label:'退出', bad:true},
];
function showBubbles(cx, cy){
  bubblesEl.innerHTML = '';
  const n = BUBBLES.length;
  BUBBLES.forEach((b, i) => {
    const el = document.createElement('button');
    el.className = 'bubble' + (b.bad ? ' bad' : '');
    el.textContent = b.label;
    const ang = (Math.PI*2*i/n) - Math.PI/2;
    const R = 56;
    const px = cx + Math.cos(ang)*R, py = cy + Math.sin(ang)*R;
    el.style.left = px + 'px'; el.style.top = py + 'px';
    el.style.transform = 'translate(-50%,-50%) scale(0)';
    el.addEventListener('click', (e) => { e.stopPropagation(); bubbleAction(b.act); });
    bubblesEl.appendChild(el);
    setTimeout(() => { el.style.transform = 'translate(-50%,-50%) scale(1)'; }, 20 + i*40);
  });
  bubblesEl.classList.add('show');
}
// Guarded: this runs on every click anywhere in the page, and it used to rebuild
// the menu's DOM each time even when the menu was not open.
function hideBubbles(){
  if (!bubblesEl.classList.contains('show')) return;
  bubblesEl.classList.remove('show');
  bubblesEl.innerHTML = '';
}
function bubbleAction(act){
  switch (act) {
    case 'theme': cycleTheme(); break;
    case 'term': api('/api/terminal?act=toggle'); break;
    case 'top': topmost = !topmost; callHost('SetTopMost', topmost); toastMsg(topmost ? '已置顶' : '取消置顶'); break;
    case 'op+': curOpacity = Math.min(100, curOpacity + 15); callHost('SetOpacity', curOpacity); toastMsg('透明度 ' + curOpacity + '%'); break;
    case 'op-': curOpacity = Math.max(15, curOpacity - 15); callHost('SetOpacity', curOpacity); toastMsg('透明度 ' + curOpacity + '%'); break;
    case 'exit': persistConfig(); callHost('Close'); api('/api/exit'); break;
  }
  hideBubbles();
}

// ---- ball + panel drag ----
// Anything with its own click handler opts out of the drag, so a click that wobbles
// a few pixels still lands as a click instead of silently moving the window. The
// alert badge counts: it is a small target and moving the pet instead of opening
// its alerts is the worst possible outcome of a 3px slip.
const isInteractive = (t) => !!(t && t.closest && t.closest('button,.alertbadge,.ball-badge'));
const ballDrag = makeDraggable(ball, { skip: isInteractive });
makeDraggable(document.querySelector('.header'), { skip: isInteractive });
makeDraggable(document.querySelector('.statebox'), { skip: isInteractive });
// .header and .statebox get cursor:move from the stylesheet, not from here.

ball.addEventListener('click', () => { if (!ballDrag.moved()) setMode('panel'); });

// hover >1s expands the panel; mouse away >3s returns to ball
let hoverTimer = null, leaveTimer = null;
ball.addEventListener('mouseenter', () => { hoverTimer = setTimeout(() => setMode('panel'), 1000); });
ball.addEventListener('mouseleave', () => { clearTimeout(hoverTimer); });
// right-click: open the panel (if ball) + bubble menu at the cursor
document.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (mode === 'ball') setMode('panel');
  showBubbles(e.clientX, e.clientY);
});
// mouse leaves the pet window for 3s -> collapse back to the ball
document.body.addEventListener('mouseleave', () => {
  clearTimeout(hoverTimer);
  if (mode === 'panel') leaveTimer = setTimeout(() => setMode('ball'), 3000);
});
document.body.addEventListener('mouseenter', () => { clearTimeout(leaveTimer); });
// click anywhere outside a bubble hides the menu
document.addEventListener('click', (e) => { if (!e.target.closest('.bubble')) hideBubbles(); });

// ---- panel actions ----
document.getElementById('bTheme').onclick = () => { cycleTheme(); };
document.getElementById('bTerm').onclick = () => { api('/api/terminal?act=toggle'); toastMsg('TERM TOGGLE'); };
document.getElementById('bCollapse').onclick = () => setMode('ball');
bUsage.onclick = () => setUsagePage(!usageOpen);
usageBar.onclick = () => setUsagePage(!usageOpen);
// A bubble only pops the moment an alert fires. Opening the panel later shows the
// badge but no detail, so the badge replays whatever is still active — and clears
// itself in the same click, which is what "点击查看后消除" means.
alertBadge.addEventListener('click', (e) => { e.stopPropagation(); openAlerts(); });
// Same contract on the collapsed ball; here the click also has to open the panel,
// since a 150px window has nowhere to draw a bubble.
ballBadge.addEventListener('click', (e) => { e.stopPropagation(); openAlerts(); });
document.getElementById('uvFsPlus').onclick = () => { applyFs(fs + 0.05); persistConfig(); toastMsg('FONT ' + Math.round(fs*100) + '%'); };
document.getElementById('uvFsMinus').onclick = () => { applyFs(fs - 0.05); persistConfig(); toastMsg('FONT ' + Math.round(fs*100) + '%'); };
uvAlerts.onclick = () => {
  const next = !alertsOn();
  uvAlerts.classList.toggle('on', next);
  uvAlerts.textContent = next ? '开' : '关';
  persistConfig({ usage: { enabled: next } });
  toastMsg(next ? '告警已开' : '告警已关');
};
document.querySelectorAll('.uv-tab').forEach((t) => t.addEventListener('click', () => {
  uvTab = t.dataset.tab;
  document.querySelectorAll('.uv-tab').forEach((x) => x.classList.toggle('on', x === t));
  if (lastState) renderUsageView(lastState.usage);
}));
// Double-click = focus the terminal, but only on dead space. Without the guard a
// double-click on a tab, a toggle or the font buttons also yanked the terminal to
// the foreground — the click did its own job and then did something unrelated.
petImg.addEventListener('dblclick', (e) => { if (!e.target.closest('button')) api('/api/focus'); });
usageViewEl.addEventListener('dblclick', (e) => { if (!e.target.closest('button')) api('/api/focus'); });

document.addEventListener('keydown', (e) => {
  if (e.key === 't' || e.key === 'T') cycleTheme();
  if (e.key === '+' || e.key === '='){ applyFs(fs + 0.05); persistConfig(); toastMsg('FONT ' + Math.round(fs*100) + '%'); }
  if (e.key === '-' || e.key === '_'){ applyFs(fs - 0.05); persistConfig(); toastMsg('FONT ' + Math.round(fs*100) + '%'); }
});
window.addEventListener('beforeunload', persistConfig);
window.addEventListener('pagehide', persistConfig);

// ---- boot ----
(function(){
  let st = 'cyber', sf = 1;
  try {
    const cfg = window.__CONFIG__ || {};
    if (cfg.theme && THEMES.indexOf(cfg.theme) !== -1) st = cfg.theme;
    if (typeof cfg.fs === 'number') sf = cfg.fs;
  } catch(_){}
  theme = st; fs = Math.min(FS_MAX, Math.max(FS_MIN, sf));
  applyTheme(theme); applyFs(fs);
  setMode('ball');                       // start as a compact ball
  syncAlertsToggle();
  render(window.__INIT__ || {});
  tick();
  connect();
})();

setInterval(tick, 1000);
</script>
</body>
</html>
